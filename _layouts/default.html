
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | PowerShare Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #5e438e;
      --lilac: #eee5ff;
      --butter: #fff0a8;
      --ink: #302844;
      --muted: #716a7e;
      --border: #e6dcef;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #faf7ff;
      color: var(--ink);
      font: 16px/1.8 "DM Sans", Arial, sans-serif;
    }
    header {
      padding: 24px;
      background: linear-gradient(120deg, var(--lilac), #fff4c6);
      border-bottom: 1px solid var(--border);
    }
    header nav, main, footer { width: min(900px, calc(100% - 36px)); margin: auto; }
    header nav { display: flex; gap: 16px; flex-wrap: wrap; }
    header a { color: var(--purple); font-weight: 700; text-decoration: none; }
    main {
      margin-top: 40px;
      margin-bottom: 50px;
      padding: clamp(22px, 5vw, 48px);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 12px 35px rgba(83, 58, 122, .08);
      overflow-wrap: anywhere;
    }
    h1, h2, h3, h4 {
      color: var(--purple);
      font-family: "Playfair Display", Georgia, serif;
      line-height: 1.3;
    }
    h1 { font-size: clamp(2rem, 5vw, 3rem); }
    h2 { margin-top: 1.8em; padding-bottom: 8px; border-bottom: 2px solid var(--lilac); }
    a { color: var(--purple); }
    img { max-width: 100%; height: auto; border-radius: 12px; }
    blockquote {
      margin-left: 0;
      padding: 12px 20px;
      background: var(--lilac);
      border-left: 4px solid var(--purple);
      border-radius: 8px;
    }
    table { display: block; width: 100%; overflow-x: auto; border-collapse: collapse; }
    th, td { padding: 10px 13px; border: 1px solid var(--border); text-align: left; }
    th { background: var(--lilac); }
    tr:nth-child(even) { background: #fffdf3; }
    code { background: #f3edff; padding: 2px 5px; border-radius: 4px; }
    footer { padding: 0 0 30px; text-align: center; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="{{ '/' | relative_url }}">← Portfolio Home</a>
      <a href="{{ '/#portfolio' | relative_url }}">All Sections</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>Refilwe Mabena · CPUT Agile Portfolio · PowerShare</footer>
</body>
</html>
